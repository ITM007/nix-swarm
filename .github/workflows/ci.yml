name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Fetch BEAM dependencies
        run: nix develop --command mix deps.get

      - name: Check Elixir formatting
        run: nix develop --command mix format --check-formatted

      - name: Compile without warnings
        run: nix develop --command mix compile --warnings-as-errors

      - name: Run BEAM tests
        run: nix develop --command mix test --warnings-as-errors --cover --seed 0

      - name: Audit Hex dependencies
        run: nix develop --command mix hex.audit

      - name: Evaluate flake checks
        run: nix flake check --no-build --print-build-logs

      - name: Build flake checks serially
        run: |
          nix build --print-build-logs --max-jobs 1 .#checks.x86_64-linux.operator-package
          nix build --print-build-logs --max-jobs 1 .#checks.x86_64-linux.agent-package
          nix build --print-build-logs --max-jobs 1 .#checks.x86_64-linux.nixos-module
          nix build --print-build-logs --max-jobs 1 .#checks.x86_64-linux.nixos-vm
          nix build --print-build-logs --max-jobs 1 .#checks.x86_64-linux.caddy-vm
          nix build --print-build-logs --max-jobs 1 .#checks.x86_64-linux.starter-syntax
          nix build --print-build-logs --max-jobs 1 .#checks.x86_64-linux.operator-smoke
          nix build --print-build-logs --max-jobs 1 .#checks.x86_64-linux.example-config-caddy
