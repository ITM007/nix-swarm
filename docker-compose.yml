name: ${NIX_SWARM_DOCKER_PROJECT:-nix-swarm-standard}

services:
  node-a:
    image: nix-swarm/nixos-node-a:${NIX_SWARM_DOCKER_IMAGE_TAG:-dev}
    hostname: node-a
    privileged: true
    init: false
    stop_signal: SIGRTMIN+3
    restart: unless-stopped
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - ${NIX_SWARM_DOCKER_SECRETS_DIR:-./docker/nixos/secrets}/nix-swarm.cookie:/etc/nix-swarm-cookie-source:ro
      - ${NIX_SWARM_DOCKER_SECRETS_DIR:-./docker/nixos/secrets}/id_ed25519.pub:/etc/nix-swarm-authorized_keys:ro
      - nix-swarm-node-a-state:/var/lib/nix-swarm
    networks:
      - swarm
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet nix-swarmd.service && systemctl is-active --quiet sshd.socket"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  node-b:
    image: nix-swarm/nixos-node-b:${NIX_SWARM_DOCKER_IMAGE_TAG:-dev}
    hostname: node-b
    privileged: true
    init: false
    stop_signal: SIGRTMIN+3
    restart: unless-stopped
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - ${NIX_SWARM_DOCKER_SECRETS_DIR:-./docker/nixos/secrets}/nix-swarm.cookie:/etc/nix-swarm-cookie-source:ro
      - ${NIX_SWARM_DOCKER_SECRETS_DIR:-./docker/nixos/secrets}/id_ed25519.pub:/etc/nix-swarm-authorized_keys:ro
      - nix-swarm-node-b-state:/var/lib/nix-swarm
    networks:
      - swarm
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet nix-swarmd.service && systemctl is-active --quiet sshd.socket"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  node-c:
    image: nix-swarm/nixos-node-c:${NIX_SWARM_DOCKER_IMAGE_TAG:-dev}
    hostname: node-c
    privileged: true
    init: false
    stop_signal: SIGRTMIN+3
    restart: unless-stopped
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - ${NIX_SWARM_DOCKER_SECRETS_DIR:-./docker/nixos/secrets}/nix-swarm.cookie:/etc/nix-swarm-cookie-source:ro
      - ${NIX_SWARM_DOCKER_SECRETS_DIR:-./docker/nixos/secrets}/id_ed25519.pub:/etc/nix-swarm-authorized_keys:ro
      - nix-swarm-node-c-state:/var/lib/nix-swarm
    networks:
      - swarm
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet nix-swarmd.service && systemctl is-active --quiet sshd.socket"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  operator:
    image: nix-swarm/nixos-node-a:${NIX_SWARM_DOCKER_IMAGE_TAG:-dev}
    hostname: operator
    command: ["/run/current-system/sw/bin/nixos-operator-command", "/run/current-system/sw/bin/sleep", "infinity"]
    environment:
      NIX_SWARM_ROLE: operator
      NIX_SWARM_DOCKER_PROFILE: ${NIX_SWARM_DOCKER_PROFILE:-standard}
      NIX_SWARM_QUERY_MODE: "1"
      ELIXIR_ERL_OPTIONS: "+fnu"
      PATH: /run/current-system/sw/bin:/bin:/usr/bin
    depends_on:
      node-a:
        condition: service_healthy
      node-b:
        condition: service_healthy
      node-c:
        condition: service_healthy
    volumes:
      - ${NIX_SWARM_DOCKER_SECRETS_DIR:-./docker/nixos/secrets}/id_ed25519:/etc/nix-swarm-operator-key:ro
      - ${NIX_SWARM_DOCKER_SECRETS_DIR:-./docker/nixos/secrets}/known_hosts:/root/.ssh/known_hosts
    networks:
      - swarm
    healthcheck:
      test: ["CMD-SHELL", "test -f /etc/nix-swarm-operator-key"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  swarm:
    name: ${NIX_SWARM_DOCKER_PROJECT:-nix-swarm-standard}

volumes:
  nix-swarm-node-a-state:
  nix-swarm-node-b-state:
  nix-swarm-node-c-state:
